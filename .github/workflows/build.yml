name: build

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Regenerate Gemini background notes (opt-in per run; review the diff before merging)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: # CSV-only triggers: the generated JSON this workflow commits can never retrigger it
      - 'songs.csv'
      - 'examples/**/*.csv'
      - 'data/overrides.csv'
  # optional monthly refresh of the numbers; uncomment if wanted
  # schedule:
  #   - cron: '0 9 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Forks: point this at your own list, usually songs.csv
  CSV_PATH: examples/todd/songs.csv
  OUT_PATH: examples/todd/enriched.json
  CONTEXT_PATH: examples/todd/context.json
  SITE_DIR: site
  # Forks: set this to your published site URL (used for link-preview tags)
  SITE_BASE: https://todkap.github.io/permanent-rotation

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: enrich
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: go run ./cmd/songs enrich --csv "$CSV_PATH" --out "$OUT_PATH"
      - name: background notes (Gemini, opt-in per run)
        if: github.event_name == 'workflow_dispatch' && inputs.notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: Settings > Secrets and variables > Actions > Variables tab.
          # Unset = empty = the tool's built-in default model.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: go run ./cmd/songs notes --csv "$CSV_PATH" --context "$CONTEXT_PATH" --out "$OUT_PATH"
      - name: render site
        run: go run ./cmd/songs site --out "$OUT_PATH" --context "$CONTEXT_PATH" --site "$SITE_DIR" --base "$SITE_BASE"
      - name: commit data changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh enriched data'
          file_pattern: 'examples/todd/enriched.json examples/todd/context.json data/enriched.json data/context.json'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
